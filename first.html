<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        .container {
            width: 90%;
            margin: 50px auto;
        }
        
        form {
            width: 100%;
        }
        
        .row {
            display: flex;
            gap: 20px;
        }
        
        .field {
            flex: 1;
            width: 40%;
        }
        
        .btun {
            background-color: blue;
            color: white;
            border-radius: 7px;
        }
        
        .ad2 {
            padding: 5px;
            width: 417px;
        }
        
        .c1 {
            width: 156px;
        }
        
        .c2 {
            width: 200px;
        }
        
        .c3 {
            width: 156px;
        }
        
        .eml {
            width: 416px;
        }
        
        .pasl {
            width: 400px;
        }
        
        .c4 {
            width: 200px;
        }
        
        .c5 {
            width: 200px;
        }
        
        .c6 {
            width: 200px;
        }
        /* Added only this */
        
        @media (min-width: 700px) and (max-width: 800px) {
            .row {
                display: flex;
                flex-direction: row;
                gap: 10px;
            }
            .field {
                width: 50%;
            }
            .eml {
                width: 100%;
            }
            .pasl {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container mt-5">

        <form>

            <div class="row">

                <div class="field">
                    <label>
                        email
                        <br>
                        <input type="email" name="emll" class="eml" required>
                    </label>
                </div>

                <div class="field">
                    <label>
                        password
                        <br>
                        <input type="password" name="pass" class="pasl" required>
                    </label>
                </div>

            </div>

            <br>

            <!-- Address -->
            <div class="adreess">
                <label>
                    address
                    <br>
                    <input type="text" name="addr" class="ad2" placeholder="1234 Main St" required>
                </label>
            </div>

            <br>

            <!-- Address 2 -->
            <div class="adreess">
                <label>
                    address 2
                    <br>
                    <input type="text" name="addr2" class="ad2"
                        placeholder="Apartment, studio, or floor">
                </label>
            </div>

            <div class="city1">

                <label for="c1">city
                    <br>
                    <select id="c4" class="c4">
                        <option selected disabled>Choose...</option>
                        <option>pune</option>
                        <option>mum</option>
                        <option>baramati</option>
                        <option>Delhi</option>
                    </select>
                </label>

                <label for="c2">state
                    <br>
                    <select id="c2" class="c5">
                        <option selected disabled>Choose...</option>
                        <option>jammu</option>
                        <option>kerala</option>
                        <option>goa</option>
                        <option>up</option>
                    </select>
                </label>

                <label class="c3">
                    zip
                    <br>
                    <input type="text" class="c6">
                </label>

            </div>

            <div class="check">

                <input type="checkbox" id="checkout" name="checkout">

                <label for="checkout">
                    Check me out
                </label>

            </div>

            <button type="button" class="btun">
                sign in
            </button>

        </form>

    </div>

</body>

</html>
